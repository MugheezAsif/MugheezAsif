<svg width="100%" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', Consolas, 'Courier New', monospace" role="img" aria-label="Continue? Insert coin: contact links below">
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="33%" stop-color="#4ade80"/>
      <stop offset="66%" stop-color="#818cf8"/><stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <style></style>
  </defs>
  <rect width="900" height="150" rx="14" fill="#0a0e1a"/>
  <rect width="900" height="150" rx="14" fill="url(#scan)"/>
  <rect x="4" y="4" width="892" height="142" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="4" filter="url(#softGlow)" opacity="0.85"/>
  <rect x="4" y="4" width="892" height="142" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <text x="410" y="78" text-anchor="middle" font-size="40" font-weight="700" fill="url(#glow)" letter-spacing="6">CONTINUE?</text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">9
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">8
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.2" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">7
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.3" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">6
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.4" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">5
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.5" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">4
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">3
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.7" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">2
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">1
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8;0.9" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#ec4899" filter="url(#tinyGlow)" opacity="0">0
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.9" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
    </text>
  <text x="450" y="118" text-anchor="middle" font-size="13" fill="#94a3b8">▶ insert coin: pick any channel below to join the party</text>
  <rect x="380" y="126" width="140" height="2" fill="#4ade80" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
